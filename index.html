<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VESTRA AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f6efe4;--card:#fffaf2;--sand:#e8d9c3;--nude:#c9a989;--brown:#7a5a43;--ink:#3b2d24;--mute:#8a7766;--line:#e6d8c4;--shadow:0 6px 22px rgba(122,90,67,.10);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0;letter-spacing:.01em}
h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.05}h2{font-size:1.9rem}h3{font-size:1.3rem}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);background:var(--bg)}
.logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.7rem;font-weight:600;letter-spacing:.12em;color:var(--brown);text-decoration:none}
.logo b{font-weight:500;color:var(--nude)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:8px 14px;border-radius:999px;color:var(--mute);text-decoration:none;font-weight:500}
nav a.on{background:var(--sand);color:var(--ink)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brown);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:28px clamp(16px,4vw,48px) 60px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:22px;border:1px solid var(--line)}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;margin-bottom:34px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.hero p{font-size:1.15rem;color:var(--mute);max-width:32ch;margin:14px 0 22px}
.btn{background:var(--brown);color:#fffaf2;border:0;border-radius:999px;padding:12px 24px;font:500 15px Inter,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--sand);color:var(--ink)}
.slot{position:relative;aspect-ratio:4/5;border-radius:22px;background:linear-gradient(160deg,#efe2cf,#d9c2a3);display:grid;place-items:center;overflow:hidden;text-align:center;padding:20px;color:var(--brown)}
.slot.sm{aspect-ratio:1;border-radius:16px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot label{cursor:pointer}
label.f{display:block;margin-bottom:14px;font-weight:500;font-size:.9rem}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fffdf8;font:inherit;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.note{background:var(--sand);border-radius:14px;padding:12px 16px;font-size:.88rem;color:var(--ink);margin:14px 0}
.tag{display:inline-block;font-size:.78rem;padding:3px 10px;border-radius:999px;background:var(--sand);color:var(--brown)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.mute{color:var(--mute)}
.sec{margin:34px 0 14px;display:flex;justify-content:space-between;align-items:baseline}
.pv{white-space:pre-wrap;background:#fffdf8;border:1px dashed var(--nude);border-radius:14px;padding:16px;margin:10px 0}
.mod{text-decoration:none;color:inherit;transition:transform .15s}.mod:hover{transform:translateY(-2px)}
.sheet{background:#fffdf8;border-radius:16px;padding:26px;border:1px solid var(--line)}
.hero2{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;margin-bottom:40px}
@media(max-width:760px){.hero2{grid-template-columns:1fr}}
.hero2 p{font-size:1.15rem;color:var(--mute);max-width:34ch;margin:14px 0 22px}
.stage{position:relative;border-radius:28px;overflow:hidden;box-shadow:0 14px 40px rgba(122,90,67,.18);aspect-ratio:4/5;background:#e8d9c3}
.stage svg,.stage>img{width:100%;height:100%;object-fit:cover;display:block}
.chip{position:absolute;left:14px;bottom:14px;background:rgba(255,250,242,.92);border-radius:999px;padding:8px 14px;font-size:.8rem;color:var(--brown)}
.chip.up{left:auto;bottom:auto;right:14px;top:14px;cursor:pointer;font-weight:500}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.mc{padding:0;overflow:hidden}.mc .th{aspect-ratio:4/3;overflow:hidden}.mc .th svg,.pj .th svg{width:100%;height:100%;display:block}.mc .bd{padding:16px 18px 20px}.mc:hover .th svg{transform:scale(1.04)}.th svg{transition:transform .4s}
.pj{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.pj .card{padding:0;overflow:hidden}.pj .th{aspect-ratio:4/5;overflow:hidden}
@media print{header,.noprint,.ctl{display:none}.ed{display:block}.paper{box-shadow:none;border:0}.ci{break-inside:avoid}body{background:#fff}}
.paper{border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);color:var(--ink)}
.ccov img,.cph img{width:100%;height:100%;object-fit:cover;display:block}.cimg{aspect-ratio:16/9;overflow:hidden}
.ccv{padding:34px 28px;text-align:center}.ccv h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0}
.cbr{letter-spacing:.3em;text-transform:uppercase;font-size:.78rem;color:var(--brown);font-weight:600}
.cmt{font-size:.85rem;color:var(--mute)}.cbody{padding:8px 24px 28px}.cft{text-align:center;padding:14px;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);border-top:1px solid rgba(122,90,67,.15)}
.cph{aspect-ratio:4/5;background:rgba(122,90,67,.08);border-radius:12px;overflow:hidden;display:grid;place-items:center;color:var(--mute);font-size:.8rem}
.cin h4{font:600 1.15rem 'Cormorant Garamond',Georgia,serif;margin:8px 0 2px}.cpr{font-weight:600;color:var(--brown);margin:2px 0}
.cg{display:grid;gap:18px;margin-top:14px}.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}@media(max-width:640px){.c3{grid-template-columns:repeat(2,1fr)}}
.calt{margin:22px 0}.calt .ci{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center}.calt.r .cph{order:2}@media(max-width:640px){.calt .ci{grid-template-columns:1fr}.calt.r .cph{order:0}}
.cls .ci{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(122,90,67,.15)}.cls .cph{aspect-ratio:1}
.ccat{font:600 1.5rem 'Cormorant Garamond',serif;margin:22px 0 4px;border-bottom:1px solid rgba(122,90,67,.2)}
.t-ed .ccv h1{font-size:clamp(2.4rem,6vw,3.8rem);font-style:italic}
.stn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sand);color:var(--brown);font:600 .9rem Inter,sans-serif;margin-right:10px;vertical-align:middle}
.mcard{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit}.mcard svg{width:100%;height:100%;display:block}.mcard.on{outline:3px solid var(--brown);outline-offset:2px}.t-ata .cbr{letter-spacing:.15em}
.ed{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:20px;align-items:start}@media(max-width:900px){.ed{grid-template-columns:1fr}}
.opt{display:flex;gap:8px;flex-wrap:wrap}.opt button{border:1px solid var(--line);background:#fffdf8;border-radius:999px;padding:7px 14px;font:inherit;font-size:.85rem;cursor:pointer;color:var(--ink)}.opt button.on{background:var(--brown);color:#fffaf2;border-color:var(--brown)}.opt button.bgb.on{color:var(--ink);outline:2px solid var(--brown)}
.pl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}.pl span{flex:1;min-width:0}.pl button{padding:4px 10px!important}.pl button:disabled{opacity:.4}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
<a class="logo" href="#inicio">VESTRA <b>AI</b></a>
<nav id="nav"></nav>
</header>
<main id="app"></main>
<script>
const NAV=[['inicio','Início'],['modelo','Modelo virtual'],['catalogos','Catálogos'],['campanhas','Campanhas'],['vendas','Materiais de venda']];
const IMG={}; // imagens ficam só na sessão (memória)
let S={projects:[],products:[]};
try{const r=localStorage.getItem('vestra');if(r)S=JSON.parse(r)}catch(e){}
if(!S.projects.length){S.projects=[
{id:'d1',nome:'Coleção Verão – demonstrativo',tipo:'Campanha',data:'12/11/2026',status:'Exemplo'},
{id:'d2',nome:'Catálogo Alfaiataria – demonstrativo',tipo:'Catálogo',data:'05/11/2026',status:'Exemplo'},
{id:'d3',nome:'Ficha Linho Areia – demonstrativo',tipo:'Material de venda',data:'28/10/2026',status:'Exemplo'},
{id:'d4',nome:'Coleção Urbana Masculina – demonstrativo',tipo:'Catálogo',data:'20/10/2026',status:'Exemplo'}]}
let saveWarn='';
const save=()=>{saveWarn='';try{localStorage.setItem('vestra',JSON.stringify(S))}catch(e){try{localStorage.setItem('vestra',JSON.stringify({...S,products:S.products.map(p=>({...p,img:''})),catalogs:(S.catalogs||[]).map(c=>({...c,capa:''}))}));saveWarn='As fotos não couberam no limite do navegador (cerca de 5 MB). Os textos foram salvos, mas as fotos ficam só nesta sessão e somem ao recarregar.'}catch(e2){saveWarn='O navegador bloqueou o salvamento. Os dados valem só até recarregar a página.'}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('pt-BR');
const uid=()=>Math.random().toString(36).slice(2,9);
const addProject=(nome,tipo,status)=>{S.projects.unshift({id:uid(),nome,tipo,data:today(),status});save()};
const $=s=>document.querySelector(s);
function slot(id,label,sm){const has=IMG[id];return `<div class="slot ${sm?'sm':''}" id="slot-${id}">${has?`<img src="${has}" alt="${esc(label)}">`:''}<label>${has?'':`<div style="font-family:'Cormorant Garamond',serif;font-size:1.3rem">${esc(label)}</div><div class="mute" style="font-size:.85rem;margin:6px 0 12px">Sua fotografia aparece aqui</div>`}<span class="btn alt" style="${has?'position:relative;z-index:1':''}">${has?'Trocar imagem':'Enviar imagem'}</span><input type="file" accept="image/*" hidden data-up="${id}"></label></div>`}
function bindUploads(after){document.querySelectorAll('[data-up]').forEach(i=>i.onchange=e=>{const f=e.target.files[0];if(!f)return;shrink(f,u=>{IMG[i.dataset.up]=u;after()})})}
function shrink(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fffaf2';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.onerror=()=>cb(r.result);im.src=r.result};r.readAsDataURL(f)}
function dedupe(){} 
function fig(i,vb){const SK=['#d9b08c','#a9795a','#e8c7a5','#8f6246'][i],H=['#4a3226','#2f241d','#6b4a35','#2f241d'][i];
const B=[
'<path d="M78 68h44l14 164H64z" fill="#c9a989"/><path d="M72 68l-6 164h22l5-132zM128 68l6 164h-22l-5-132z" fill="#7a5a43"/><path d="M72 68l-14 92 10 3 12-82zM128 68l14 92-10 3-12-82z" fill="#7a5a43"/>',
'<path d="M68 150h64l-5 82h-22l-5-58-5 58H73z" fill="#e0cfb6"/><path d="M68 68h64l8 90H60z" fill="#7a5a43"/><path d="M60 80l-4 80h12zM140 80l4 80h-12z" fill="#7a5a43"/><path d="M88 68l12 40 12-40z" fill="#fffaf2"/><rect x="70" y="230" width="24" height="6" fill="#3b2d24"/><rect x="106" y="230" width="24" height="6" fill="#3b2d24"/>',
'<path d="M68 136h64l14 96h-36l-10-66-10 66H54z" fill="#c9a989"/><path d="M74 68h52l6 72H68z" fill="#fffaf2"/><path d="M74 70l-14 62 9 3 11-50zM126 70l14 62-9 3-11-50z" fill="#fffaf2"/>',
'<path d="M74 190h22l-2 42H72zM104 190h22l2 42h-24z" fill="#7a5a43"/><path d="M66 68h68l12 128H54z" fill="#c9a989"/><path d="M66 70l-12 100h14l8-90zM134 70l12 100h-14l-8-90z" fill="#c9a989"/><path d="M88 68l12 50 12-50z" fill="#7a5a43"/>'][i];
return `<svg viewBox="${vb||'0 0 200 250'}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração de look"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1e5d2"/><stop offset="1" stop-color="#d8c0a0"/></linearGradient></defs><rect width="200" height="250" fill="url(#gg)"/><ellipse cx="100" cy="238" rx="62" ry="6" fill="#b89a7a" opacity=".35"/>${i%2==0?`<path d="M82 40a18 18 0 0 1 36 0v24l-6-14h-24l-6 14z" fill="${H}"/>`:''}${B}<rect x="94" y="52" width="12" height="18" fill="${SK}"/><circle cx="100" cy="40" r="14" fill="${SK}"/><path d="M85 38a15 15 0 0 1 30 0c-8-5-22-5-30 0z" fill="${H}"/></svg>`}
const V={};
V.inicio=()=>`
<section class="hero2"><div><h1>Sua moda, sua criatividade, potencializada por IA.</h1><p>Imagens, catálogos, campanhas e materiais de venda em um só lugar.</p><a class="btn" href="#novo">Criar novo projeto</a></div><div class="stage">${IMG.hero?`<img src="${IMG.hero}" alt="Foto principal da coleção">`:fig(0)}<label class="chip up">Usar minha fotografia<input type="file" accept="image/*" hidden data-up="hero"></label>${IMG.hero?'':'<span class="chip">Ilustração demonstrativa · envie sua fotografia editorial</span>'}</div></section>
<div class="grid g4">${NAV.slice(1).map(([k,n],i)=>`<a class="card mod mc" href="#${k}"><div class="th">${fig([0,3,2,1][i],'44 50 112 150')}</div><div class="bd"><h3>${n}</h3><p class="mute" style="margin:6px 0 ${i?0:10}px">${['Combine uma peça com uma modelo autorizada.','Cadastre produtos e monte o catálogo.','Textos para Instagram e WhatsApp.','Fichas de produto e apresentação de coleção.'][i]}</p>${i?'':'<span class="tag">IA ainda não conectada</span>'}</div></a>`).join('')}</div>
<div class="sec"><h2>Projetos recentes</h2></div>
<div class="pj">${S.projects.slice(0,8).map((p,i)=>{const l=p.look??i%4;return `<div class="card"><div class="th">${fig(l,'30 40 140 190')}</div><div style="padding:12px 14px"><strong>${esc(p.nome)}</strong><div class="mute" style="font-size:.82rem;margin:2px 0 8px">${esc(p.tipo)} · ${esc(p.data)} · ${l%2?'Masculino':'Feminino'}</div><span class="tag">${esc(p.status)}</span></div></div>`}).join('')}</div>`;
V.novo=()=>`<h2>Novo projeto</h2><p class="mute">Escolha o que você quer criar.</p><div class="grid g2" style="margin-top:18px">${NAV.slice(1).map(([k,n])=>`<a class="card mod" href="#${k}"><h3>${n}</h3></a>`).join('')}</div>`;
V.modelo=()=>`<h2>Modelo virtual</h2><p class="mute">Envie a peça e uma imagem de modelo com uso autorizado para registrar o pedido de composição.</p>
<div class="grid g2" style="margin-top:18px"><div class="card"><h3>Peça de roupa</h3>${slot('roupa','Foto da roupa')}</div><div class="card"><h3>Modelo</h3>${slot('modeloimg','Imagem da modelo')}</div></div>
<div class="card" style="margin-top:18px"><form id="fm"><div class="grid g2"><label class="f">Nome do projeto<input name="n" required placeholder="Ex.: Vestido linho – verão"></label>
<label class="f">Estilo<select name="e"><option>Casual</option><option>Social</option><option>Elegante</option><option>Urbano</option></select></label>
<label class="f">Cenário<select name="c"><option>Estúdio areia</option><option>Luz natural interna</option><option>Fundo bege liso</option></select></label>
<label class="f">Observações<textarea name="o" placeholder="Caimento, cores, enquadramento…"></textarea></label></div>
<label style="display:flex;gap:10px;align-items:flex-start;margin-bottom:12px"><input type="checkbox" name="a" required style="width:auto;margin-top:4px"> Tenho autorização para usar a imagem desta modelo.</label>
<button class="btn" type="submit">Registrar pedido</button></form>
<div class="note">A geração de imagem por IA ainda não está conectada nesta versão. O pedido fica salvo no histórico como "Aguardando integração de IA", sem resultado gerado.</div><div id="msg"></div></div>`;
V.catrapido=()=>`<p><a href="#catalogos" class="mute">← Voltar ao módulo Catálogos</a></p><h2>Cadastro rápido e pré-visualização geral</h2><p class="mute">Cadastre os produtos e veja o catálogo montado.</p>
<div class="grid g2" style="margin-top:18px"><div class="card"><h3>Novo produto</h3><form id="fp" style="margin-top:12px">${slot('prodnovo','Foto do produto',1)}<div style="height:12px"></div>
<label class="f">Nome<input name="nome" required></label><div class="grid g2" style="gap:0 12px"><label class="f">Referência<input name="sku"></label><label class="f">Preço (R$)<input name="preco" inputmode="decimal"></label>
<label class="f">Categoria<select name="cat"><option>Casual</option><option>Social</option><option>Elegante</option><option>Urbano</option></select></label><label class="f">Tamanhos<input name="tam" placeholder="P, M, G"></label></div>
<label class="f">Descrição<textarea name="desc"></textarea></label><button class="btn" type="submit">Salvar produto</button></form></div>
<div class="card"><h3>Produtos cadastrados (${S.products.length})</h3>${S.products.length?S.products.map(p=>`<div class="row"><span>${esc(p.nome)} <span class="mute">${esc(p.sku)}</span></span><button class="btn alt" data-del="${p.id}" style="padding:6px 14px">Remover</button></div>`).join(''):'<p class="mute">Nenhum produto ainda. Preencha o formulário para começar.</p>'}</div></div>
<div class="sec"><h2>Pré-visualização do catálogo</h2><button class="btn alt noprint" onclick="try{print()}catch(e){}">Imprimir</button></div>
<div class="grid g3">${S.products.map(p=>`<div class="card" style="padding:12px">${p.img?`<img src="${p.img}" alt="" style="width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px">`:'<div class="slot sm" style="aspect-ratio:4/5">Sem foto</div>'}<h3 style="margin-top:10px">${esc(p.nome)}</h3><div class="mute">${esc(p.cat)} · ${esc(p.tam)}</div><strong>${p.preco?'R$ '+esc(p.preco):''}</strong></div>`).join('')||'<p class="mute">O catálogo aparece aqui conforme você cadastra produtos.</p>'}</div>`;
V.campanhas=()=>`<h2>Campanhas</h2><p class="mute">Monte textos prontos para divulgar. Eles seguem modelos de redação e não são gerados por IA.</p>
<div class="grid g2" style="margin-top:18px"><div class="card"><form id="fc"><label class="f">Coleção ou lançamento<input name="col" required placeholder="Ex.: Coleção Areia"></label>
<label class="f">Produto em destaque<select name="prod"><option value="">Escreva abaixo</option>${S.products.map(p=>`<option>${esc(p.nome)}</option>`).join('')}</select></label>
<label class="f">Ou nome livre<input name="livre"></label>
<label class="f">Canal<select name="canal"><option>Instagram</option><option>WhatsApp</option><option>Lançamento de coleção</option></select></label>
<label class="f">Oferta ou chamada<input name="of" placeholder="Ex.: 10% no lançamento"></label><button class="btn" type="submit">Montar texto</button></form></div>
<div class="card"><h3>Pré-visualização</h3><div id="out" class="pv mute">O texto aparece aqui.</div><button class="btn alt" id="cp">Copiar texto</button></div></div>`;
V.vendas=()=>`<h2>Materiais de venda</h2><p class="mute">Ficha de produto e apresentação de coleção a partir dos itens cadastrados.</p>
${S.products.length?`<div class="card" style="margin-top:18px"><label class="f">Produto<select id="sp">${S.products.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></label><div id="ficha"></div><div style="margin-top:12px"><button class="btn alt noprint" onclick="try{print()}catch(e){}">Imprimir ficha</button></div></div>
<div class="sec"><h2>Apresentação da coleção</h2></div><div class="sheet"><h3>Coleção · ${S.products.length} peças</h3>${S.products.map(p=>`<div class="row"><span>${esc(p.nome)} <span class="mute">${esc(p.cat)}</span></span><strong>${p.preco?'R$ '+esc(p.preco):''}</strong></div>`).join('')}</div>`:`<div class="card" style="margin-top:18px"><p>Cadastre ao menos um produto para gerar fichas e apresentações.</p><a class="btn" href="#catalogos">Cadastrar produto</a></div>`}`;
function fichaHTML(p){return `<div class="sheet" style="display:grid;grid-template-columns:200px 1fr;gap:20px">${p.img?`<img src="${p.img}" alt="" style="width:100%;border-radius:14px">`:'<div class="slot sm">Sem foto</div>'}<div><h3>${esc(p.nome)}</h3><p class="mute">Ref. ${esc(p.sku)||'—'} · ${esc(p.cat)}</p><p>${esc(p.desc)||'Sem descrição.'}</p><p><strong>Cores:</strong> ${esc(p.cores)||'—'}</p><p><strong>Tamanhos:</strong> ${esc(p.tam)||'—'}</p><p><strong>Tecido:</strong> ${esc(p.tec)||'—'}</p><p><strong>Preço:</strong> ${p.preco?'R$ '+esc(p.preco):'—'}</p></div></div>`}
const NAV_H=[NAV[0],['produtos','Produtos'],NAV[1],['provador','Provador virtual'],...NAV.slice(2),['conta','Conta']];
let PID=null,DEL=null,PIMG='',F={q:'',cat:'',group:false};
const cur=()=>S.products.find(p=>p.id===PID);
const money=p=>p.preco?'R$ '+esc(p.preco):'—';
const photo=(p,st)=>p.img?`<img src="${p.img}" alt="${esc(p.nome)}" style="width:100%;aspect-ratio:4/5;object-fit:cover;display:block">`:`<div class="slot" style="aspect-ratio:4/5;border-radius:0">Sem foto</div>`;
function acts(p,nv){const s='padding:8px 16px';return (nv?'':`<button class="btn" data-ver="${p.id}" style="${s}">Detalhes</button>`)+`<button class="btn alt" data-ed="${p.id}" style="${s}">Editar</button>`+(DEL===p.id?`<button class="btn" data-dy="${p.id}" style="${s};background:#5a3f2e">Confirmar exclusão</button><button class="btn alt" data-dn="1" style="${s}">Cancelar</button>`:`<button class="btn alt" data-dx="${p.id}" style="${s}">Excluir</button>`)}
const pcard=p=>`<div class="card" style="padding:0;overflow:hidden">${photo(p)}<div style="padding:14px"><span class="tag">${esc(p.cat||'Sem categoria')}</span><h3 style="margin:8px 0 2px">${esc(p.nome)}</h3><div class="mute" style="font-size:.88rem">Ref. ${esc(p.sku)||'—'} · ${money(p)}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${acts(p)}</div></div></div>`;
function gal(){const q=F.q.toLowerCase();const L=S.products.filter(p=>(!F.cat||p.cat===F.cat)&&(!q||[p.nome,p.sku,p.tec,p.cores].join(' ').toLowerCase().includes(q)));
if(!L.length)return `<div class="card"><p>${S.products.length?'Nenhum produto encontrado com esses filtros.':'Nenhum produto cadastrado ainda. Comece adicionando o primeiro.'}</p></div>`;
if(!F.group)return `<div class="grid g4">${L.map(pcard).join('')}</div>`;
const g={};L.forEach(p=>(g[p.cat||'Sem categoria']=g[p.cat||'Sem categoria']||[]).push(p));
return Object.keys(g).sort().map(c=>`<div class="sec" style="margin:24px 0 12px"><h3>${esc(c)} <span class="mute" style="font-size:1rem">(${g[c].length})</span></h3></div><div class="grid g4">${g[c].map(pcard).join('')}</div>`).join('')}
V.produtos=()=>{const cats=[...new Set(S.products.map(p=>p.cat).filter(Boolean))].sort();return `<div class="sec" style="margin-top:0"><div><h2>Produtos</h2><p class="mute" style="margin:2px 0 0">Cadastro base para catálogos, campanhas e materiais de venda.</p></div><button class="btn" id="addp">Adicionar produto</button></div>
<div class="note"><strong>Armazenamento:</strong> os textos ficam salvos neste navegador, sem envio a servidores. As fotos são reduzidas (até 900 px) e salvas junto se couberem no limite do navegador (cerca de 5 MB). Se não couberem, valem só até recarregar a página.${saveWarn?`<br><strong>Aviso:</strong> ${esc(saveWarn)}`:''}</div>
<div class="card" style="padding:14px;margin-bottom:18px"><div class="grid g3" style="gap:12px"><input id="pfq" placeholder="Buscar por nome, referência, cor ou tecido" value="${esc(F.q)}" style="margin:0"><select id="pfc" style="margin:0"><option value="">Todas as categorias</option>${cats.map(c=>`<option ${c===F.cat?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="pfg" style="margin:0"><option value="0">Galeria simples</option><option value="1" ${F.group?'selected':''}>Organizar por categoria</option></select></div></div><div id="gal">${gal()}</div>`};
V.produto=()=>{const p=cur();return `<p><a href="#produtos" class="mute">← Voltar aos produtos</a></p><div class="grid g2" style="align-items:start"><div class="card" style="padding:0;overflow:hidden">${photo(p)}</div><div class="card"><span class="tag">${esc(p.cat||'Sem categoria')}</span><h2 style="margin:8px 0 12px">${esc(p.nome)}</h2>${[['Referência',esc(p.sku)||'—'],['Preço',money(p)],['Cores',esc(p.cores)||'—'],['Tamanhos',esc(p.tam)||'—'],['Tecido',esc(p.tec)||'—'],['Descrição',esc(p.desc)||'—']].map(([a,b])=>`<div class="row" style="align-items:flex-start"><span class="mute">${a}</span><span style="text-align:right;max-width:65%">${b}</span></div>`).join('')}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px"><a class="btn" href="#ficha" style="padding:8px 16px">Ver ficha comercial</a>${acts(p,1)}</div></div></div>`};
const ftxt=p=>`${p.nome}\nRef.: ${p.sku||'—'} | Categoria: ${p.cat||'—'}\nPreço: ${p.preco?'R$ '+p.preco:'—'}\nCores: ${p.cores||'—'}\nTamanhos: ${p.tam||'—'}\nTecido: ${p.tec||'—'}\n\n${p.desc||''}`;
V.ficha=()=>{const p=cur();return `<div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><a class="btn alt" href="#produto">← Voltar</a><button class="btn" id="prt">Imprimir</button><button class="btn alt" id="cpf">Copiar texto da ficha</button></div><div class="sheet" style="max-width:800px;margin:auto"><div class="mute" style="font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:.14em;margin-bottom:14px">VESTRA AI · Ficha comercial</div><div class="grid g2" style="align-items:start"><div style="border-radius:16px;overflow:hidden">${photo(p)}</div><div><span class="tag">${esc(p.cat||'Sem categoria')}</span><h2 style="margin:8px 0">${esc(p.nome)}</h2><p class="mute" style="margin:0 0 12px">Ref. ${esc(p.sku)||'—'}</p><p style="font-size:1.5rem;font-family:'Cormorant Garamond',serif;margin:0 0 14px"><strong>${money(p)}</strong></p><p><strong>Cores:</strong> ${esc(p.cores)||'—'}</p><p><strong>Tamanhos:</strong> ${esc(p.tam)||'—'}</p><p><strong>Tecido:</strong> ${esc(p.tec)||'—'}</p><p>${esc(p.desc)}</p></div></div></div><p class="mute noprint" style="text-align:center;font-size:.85rem">Ficha montada com os dados do cadastro. A impressão pode não funcionar dentro da visualização do chat.</p>`};
const prevHTML=()=>PIMG?`<img src="${PIMG}" alt="Pré-visualização">`:`<div>Sem fotografia</div>`;
V['produto-form']=()=>{const p=cur()||{};PIMG=p.img||'';const cs=[...new Set(['Casual','Social','Elegante','Urbano',...S.products.map(x=>x.cat).filter(Boolean)])];const f=(l,n,x)=>`<label class="f">${l}<input name="${n}" value="${esc(p[n])}" ${x||''}></label>`;
return `<p><a href="#produtos" class="mute">← Voltar aos produtos</a></p><h2>${p.id?'Editar produto':'Adicionar produto'}</h2><form id="pf" class="card" style="margin-top:16px"><div class="grid g2"><div><div class="slot" id="pprev" style="aspect-ratio:4/5">${prevHTML()}</div><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><label class="btn alt">Escolher fotografia<input type="file" accept="image/*" hidden id="pph"></label><button type="button" class="btn alt" id="prm">Remover foto</button></div><p class="mute" style="font-size:.85rem">A foto é reduzida e salva no navegador se couber (limite de cerca de 5 MB). Se não couber, só dura até recarregar.</p></div>
<div>${f('Nome do produto','nome','required')}<div class="grid g2" style="gap:0 12px">${f('Referência','sku')}${f('Preço (R$)','preco','inputmode="decimal"')}</div><label class="f">Categoria<input name="cat" list="cl" value="${esc(p.cat)}" required placeholder="Escolha ou digite"><datalist id="cl">${cs.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>${f('Cores','cores','placeholder="Areia, off-white"')}<div class="grid g2" style="gap:0 12px">${f('Tamanhos','tam','placeholder="P, M, G"')}${f('Tecido','tec')}</div><label class="f">Descrição<textarea name="desc">${esc(p.desc)}</textarea></label></div></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px"><button class="btn" type="submit">Salvar produto</button><a class="btn alt" href="#produtos">Cancelar</a></div></form>`};
function bindP(v){
 if(v==='produtos'){$('#addp').onclick=()=>{PID=null;location.hash='produto-form'};$('#pfq').oninput=e=>{F.q=e.target.value;$('#gal').innerHTML=gal()};$('#pfc').onchange=e=>{F.cat=e.target.value;render()};$('#pfg').onchange=e=>{F.group=e.target.value==='1';render()}}
 if(v==='produto-form'){const up=()=>{$('#pprev').innerHTML=prevHTML()};$('#pph').onchange=e=>{const f=e.target.files[0];if(f)shrink(f,u=>{PIMG=u;up()})};$('#prm').onclick=()=>{PIMG='';up()};
  $('#pf').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.img=PIMG;const p=cur();if(p)Object.assign(p,d);else{const n={id:uid(),...d};S.products.push(n);PID=n.id;addProject('Produto cadastrado: '+d.nome,'Produto','Cadastrado')}save();location.hash='produto'}}
 if(v==='ficha'){$('#prt').onclick=()=>{try{print()}catch(e){}};$('#cpf').onclick=()=>{try{navigator.clipboard.writeText(ftxt(cur()));$('#cpf').textContent='Texto copiado'}catch(e){}}}
 $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.ver){PID=d.ver;location.hash='produto'}else if(d.ed){PID=d.ed;location.hash='produto-form'}else if(d.dx){DEL=d.dx;render()}else if(d.dn){DEL=null;render()}else if(d.dy){S.products=S.products.filter(p=>p.id!==d.dy);DEL=null;save();if(v==='produto'){PID=null;location.hash='produtos'}else render()}}}
S.catalogs=S.catalogs||[];
const TPL={min:{n:'Minimalista bege',l:'grade3',f:['nome','sku','preco']},ed:{n:'Editorial de moda',l:'alternado',f:['nome','desc','preco']},col:{n:'Catálogo de coleção',l:'grade2',f:['nome','sku','cat','cores']},ata:{n:'Catálogo para atacado',l:'lista',f:['nome','sku','tam','cores','preco']},var:{n:'Catálogo para varejo',l:'grade3',f:['nome','preco','tam']}};
const BG={nude:'#e3cdb3',areia:'#ebdcc6',creme:'#fbf4e6'};
const LAY={grade2:'Grade com 2 colunas',grade3:'Grade com 3 colunas',alternado:'Foto grande alternada',lista:'Lista com miniaturas'};
const INF=[['nome','Nome'],['sku','Referência'],['preco','Preço'],['cat','Categoria'],['cores','Cores'],['tam','Tamanhos'],['tec','Tecido'],['desc','Descrição']];
let CE=null,CDEL=null;
const flds=a=>Object.fromEntries(a.map(k=>[k,true]));
const newCat=()=>({id:null,nome:'',marca:'',modelo:'min',fundo:'areia',layout:'grade3',campos:flds(TPL.min.f),prods:[],capa:'',pv:false});
function catHTML(c){const bg=BG[c.fundo]||BG.areia,ps=c.prods.map(id=>S.products.find(p=>p.id===id)).filter(Boolean);
const it=p=>`<div class="ci"><div class="cph">${p.img?`<img src="${p.img}" alt="${esc(p.nome)}">`:'<span>Sem foto</span>'}</div><div class="cin">${c.campos.nome?`<h4>${esc(p.nome)}</h4>`:''}${INF.slice(1).filter(([k])=>c.campos[k]&&p[k]).map(([k,l])=>k==='preco'?`<div class="cpr">R$ ${esc(p.preco)}</div>`:k==='desc'?`<div class="cmt">${esc(p.desc)}</div>`:`<div class="cmt">${k==='sku'?'Ref.':l}: ${esc(p[k])}</div>`).join('')}</div></div>`;
const wrap=L=>c.layout==='alternado'?L.map((p,i)=>`<div class="calt ${i%2?'r':''}">${it(p)}</div>`).join(''):c.layout==='lista'?`<div class="cls">${L.map(it).join('')}</div>`:`<div class="cg ${c.layout==='grade2'?'c2':'c3'}">${L.map(it).join('')}</div>`;
let body;if(!ps.length)body='<p class="cmt" style="text-align:center;padding:30px">Selecione produtos para montar as páginas do catálogo.</p>';
else if(c.modelo==='col'){const g={};ps.forEach(p=>(g[p.cat||'Peças']=g[p.cat||'Peças']||[]).push(p));body=Object.keys(g).sort().map(k=>`<h3 class="ccat">${esc(k)}</h3>${wrap(g[k])}`).join('')}else body=wrap(ps);
return `<div class="paper t-${c.modelo}" style="background:${bg}"><div class="ccov">${c.capa?`<div class="cimg"><img src="${c.capa}" alt="Capa"></div>`:''}<div class="ccv"><div class="cbr">${esc(c.marca||'MARCA')}</div><h1>${esc(c.nome||'Nome da coleção')}</h1><div class="cmt">${TPL[c.modelo].n} · ${ps.length} peça${ps.length==1?'':'s'}</div></div></div><div class="cbody">${body}</div><div class="cft">${esc(c.marca||'')} · ${new Date().getFullYear()}</div></div>`}
const EXP='<div class="note noprint"><strong>Exportação em PDF:</strong> a exportação direta de arquivo PDF ainda não está implementada. Use "Imprimir / salvar como PDF" para gerar o PDF pelo navegador. Se a janela de impressão não abrir na visualização do chat, abra o link do artefato em uma nova aba.</div>';
V.catalogos=()=>`<div class="sec" style="margin-top:0"><div><h2>Catálogos</h2><p class="mute" style="margin:2px 0 0">Transforme os produtos cadastrados em catálogos de moda.</p></div><button class="btn" id="cnew">Criar novo catálogo</button></div>${EXP}<div class="note">Os catálogos usam as fotos dos produtos e ficam salvos neste navegador, com os limites de armazenamento de fotos descritos em Produtos.</div>
${S.catalogs.length?`<div class="grid g4">${S.catalogs.map(c=>`<div class="card" style="padding:0;overflow:hidden"><div style="aspect-ratio:4/3;background:${BG[c.fundo]};overflow:hidden;display:grid;place-items:center">${c.capa?`<img src="${c.capa}" alt="" style="width:100%;height:100%;object-fit:cover">`:`<div class="cbr">${esc(c.marca)}</div>`}</div><div style="padding:14px"><h3>${esc(c.nome)}</h3><div class="mute" style="font-size:.85rem;margin-bottom:10px">${esc(c.marca)} · ${TPL[c.modelo].n} · ${c.prods.length} produto(s)</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-copen="${c.id}" style="padding:8px 16px">Abrir</button><button class="btn alt" data-cedit="${c.id}" style="padding:8px 16px">Editar</button>${CDEL===c.id?`<button class="btn" data-cxy="${c.id}" style="padding:8px 16px;background:#5a3f2e">Confirmar exclusão</button><button class="btn alt" data-cxn="1" style="padding:8px 16px">Cancelar</button>`:`<button class="btn alt" data-cxd="${c.id}" style="padding:8px 16px">Excluir</button>`}</div></div></div>`).join('')}</div>`:`<div class="card"><p>Você ainda não criou catálogos.${S.products.length?'':' Cadastre produtos primeiro em <a href="#produtos">Produtos</a>.'}</p></div>`}
<p style="margin-top:22px"><a class="mute" href="#catrapido">Abrir cadastro rápido de produtos e pré-visualização geral</a></p>`;
function plist(){const c=CE,sel=c.prods.map(id=>S.products.find(p=>p.id===id)).filter(Boolean),rest=S.products.filter(p=>!c.prods.includes(p.id));
if(!S.products.length)return '<p class="mute">Nenhum produto cadastrado. <a href="#produtos">Cadastre produtos</a> para montar o catálogo.</p>';
return (sel.length?'<div class="mute" style="font-size:.8rem">Ordem no catálogo (posição das fotografias)</div>'+sel.map((p,i)=>`<div class="pl"><span>${i+1}. ${esc(p.nome)}</span><button class="btn alt" data-cup="${p.id}" ${i?'':'disabled'} aria-label="Subir">↑</button><button class="btn alt" data-cdw="${p.id}" ${i<sel.length-1?'':'disabled'} aria-label="Descer">↓</button><button class="btn alt" data-crm="${p.id}">Remover</button></div>`).join(''):'')+(rest.length?`<div class="mute" style="font-size:.8rem;margin-top:10px">Disponíveis <button class="btn alt" data-all="1" style="padding:2px 10px">Adicionar todos</button></div>`+rest.map(p=>`<div class="pl"><span>${esc(p.nome)}</span><button class="btn alt" data-cadd="${p.id}">Adicionar</button></div>`).join(''):'')}
V['catalogo-editor']=()=>{const c=CE;if(c.pv)return `<div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><button class="btn alt" id="cbk">← Voltar e editar</button><button class="btn" id="csv">Salvar catálogo</button><button class="btn alt" id="cprt">Imprimir / salvar como PDF</button></div>${EXP}<div id="cmsg"></div><div style="max-width:900px;margin:auto">${catHTML(c)}</div>`;
const K=(t,b)=>`<div class="card" style="padding:16px;margin-bottom:14px"><h3 style="margin-bottom:10px">${t}</h3>${b}</div>`;
return `<p class="noprint"><a href="#catalogos" class="mute">← Voltar aos catálogos</a></p><div class="sec noprint" style="margin:8px 0 14px"><h2>${c.id?'Editar catálogo':'Novo catálogo'}</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn alt" id="cpv">Pré-visualização em tela cheia</button><button class="btn" id="csv">Salvar catálogo</button></div></div><div id="cmsg"></div>
<div class="ed"><div class="ctl">${K('Dados',`<label class="f">Nome da coleção<input id="cnome" value="${esc(c.nome)}"></label><label class="f">Nome da marca<input id="cmarca" value="${esc(c.marca)}"></label><label class="btn alt" style="padding:8px 16px">${c.capa?'Trocar capa':'Imagem de capa'}<input type="file" accept="image/*" hidden id="ccapa"></label> ${c.capa?'<button class="btn alt" id="ccrm" style="padding:8px 16px">Remover capa</button>':''}`)}
${K('Modelo',`<div class="opt">${Object.entries(TPL).map(([k,t])=>`<button data-tpl="${k}" class="${c.modelo===k?'on':''}">${t.n}</button>`).join('')}</div><p class="mute" style="font-size:.8rem;margin-bottom:0">Trocar o modelo reaplica o layout e as informações sugeridas.</p>`)}
${K('Estilo',`<div class="opt" style="margin-bottom:12px">${[['nude','Nude'],['areia','Areia'],['creme','Creme']].map(([k,n])=>`<button class="bgb ${c.fundo===k?'on':''}" data-bg="${k}" style="background:${BG[k]}">${n}</button>`).join('')}</div><label class="f" style="margin:0">Posição das fotografias<select id="clay">${Object.entries(LAY).map(([k,n])=>`<option value="${k}" ${c.layout===k?'selected':''}>${n}</option>`).join('')}</select></label>`)}
${K('Informações exibidas',`<div class="grid" style="grid-template-columns:1fr 1fr;gap:6px">${INF.map(([k,n])=>`<label><input type="checkbox" data-f="${k}" ${c.campos[k]?'checked':''} style="display:inline;width:auto;margin:0 6px 0 0">${n}</label>`).join('')}</div>`)}
${K('Produtos ('+c.prods.length+')',plist())}</div>
<div><div id="cprev">${catHTML(c)}</div></div></div>`};
const cmsg=t=>{const m=$('#cmsg');if(m)m.innerHTML=`<div class="note">${esc(t)}</div>`};
function saveC(){const c=CE;if(!c.nome.trim()){cmsg('Dê um nome à coleção antes de salvar.');return}
c.prods=c.prods.filter(id=>S.products.some(p=>p.id===id));const d=JSON.parse(JSON.stringify(c));delete d.pv;const i=S.catalogs.findIndex(x=>x.id===c.id);
if(i>=0)S.catalogs[i]=d;else{d.id=uid();c.id=d.id;S.catalogs.unshift(d);addProject('Catálogo: '+d.nome,'Catálogo','Salvo')}
save();cmsg('Catálogo salvo no histórico.'+(saveWarn?' '+saveWarn:''))}
function bindC(v){
 if(v==='catalogos'){$('#cnew').onclick=()=>{CE=newCat();location.hash='catalogo-editor'};
  $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,c=S.catalogs.find(x=>x.id===(d.copen||d.cedit));
   if(d.copen&&c){CE=JSON.parse(JSON.stringify(c));CE.pv=true;location.hash='catalogo-editor'}else if(d.cedit&&c){CE=JSON.parse(JSON.stringify(c));CE.pv=false;location.hash='catalogo-editor'}else if(d.cxd){CDEL=d.cxd;render()}else if(d.cxn){CDEL=null;render()}else if(d.cxy){S.catalogs=S.catalogs.filter(x=>x.id!==d.cxy);CDEL=null;save();render()}}}

const API_BASE=''; // vazio = backend no mesmo domínio do site. Se o site ficar em outro domínio, coloque a URL do backend.
let SESS=null,RECOVER=false,AM='login';
try{SESS=JSON.parse(localStorage.getItem('vestra_sb')||'null')}catch(e){}
const sbSave=s=>{SESS=s;try{s?localStorage.setItem('vestra_sb',JSON.stringify(s)):localStorage.removeItem('vestra_sb')}catch(e){}};
const mk=j=>({access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid:j.user?j.user.id:'',email:j.user?j.user.email:''});
(function(){const h=location.hash;if(h.includes('access_token=')){const p=new URLSearchParams(h.slice(1)),t=p.get('access_token');if(t){SESS={access_token:t,refresh_token:p.get('refresh_token'),exp:Date.now()+(+p.get('expires_in')||3600)*1000,uid:'',email:''};if(p.get('type')==='recovery')RECOVER=true;else sbSave(SESS);history.replaceState(null,'',location.pathname+'#conta')}}})();
async function sbReq(path,o={}){const r=await fetch(SB.url+path,{method:o.method||'GET',body:o.body,headers:{apikey:SB.key,'Content-Type':'application/json',...(SESS&&!o.anon?{Authorization:'Bearer '+SESS.access_token}:{})}});const t=await r.text();let j={};try{j=JSON.parse(t)}catch(e){}if(!r.ok)throw Object.assign(new Error(j.msg||j.error_description||j.message||j.error||'Erro '+r.status),{status:r.status});return j}
async function sbEnsure(){if(!SESS)return false;if(SESS.exp-Date.now()<60e3){if(!SESS.refresh_token)return false;try{sbSave(mk(await sbReq('/auth/v1/token?grant_type=refresh_token',{method:'POST',anon:1,body:JSON.stringify({refresh_token:SESS.refresh_token})})))}catch(e){sbSave(null);return false}}return true}
async function sbLogout(){try{await sbReq('/auth/v1/logout',{method:'POST'})}catch(e){}sbSave(null);RECOVER=false;ACC={mode:'auth',checked:true};render()}
async function accDetect(){
 try{await fetch(SB.url+'/auth/v1/health',{headers:{apikey:SB.key}})}catch(e){ACC={mode:'local',checked:true};return}
 try{const pl=await sbReq('/rest/v1/plans?select=id,name,price_cents,credits&order=price_cents',{anon:1});if(pl.length)PCFG.splice(0,PCFG.length,...pl.map(r=>({id:r.id,n:r.name,p:r.price_cents,c:r.credits})))}catch(e){}
 if(RECOVER){ACC={mode:'reset',checked:true};return}
 if(!SESS||!(await sbEnsure())){ACC={mode:'auth',checked:true};return}
 try{
  if(!SESS.uid){const u=await sbReq('/auth/v1/user');sbSave({...SESS,uid:u.id,email:u.email})}
  const id=SESS.uid,q=p=>sbReq('/rest/v1/'+p);
  const [pr,sub,led,pay,gen]=await Promise.all([q('profiles?id=eq.'+id+'&select=credits,reserved'),q('subscriptions?user_id=eq.'+id+'&status=in.(active,past_due,canceled)&select=status,plan_id,period_end,plans(name)&order=created_at.desc&limit=1'),q('credit_ledger?user_id=eq.'+id+'&select=delta,reason,balance_after,created_at&order=id.desc&limit=50'),q('payments?user_id=eq.'+id+'&select=amount_cents,status,method,paid_at&order=id.desc&limit=30'),q('generations?user_id=eq.'+id+'&select=id,status,created_at&order=id.desc&limit=30')]);
  const p=pr[0]||{credits:0,reserved:0},s=sub[0];let cfg={backend:false};
  try{const r=await fetch(API_BASE+'/api/config');if(r.ok&&(r.headers.get('content-type')||'').includes('json'))cfg={backend:true,...await r.json()}}catch(e){}
  ACC={mode:'remote',checked:true,email:SESS.email,d:{user:{credits:p.credits,reserved:p.reserved,available:p.credits-p.reserved},subscription:s?{status:s.status,plan_id:s.plan_id,plan_name:s.plans?s.plans.name:s.plan_id,period_end:s.period_end?new Date(s.period_end).getTime():null}:null,ledger:led,payments:pay,generations:gen,config:cfg}}
 }catch(e){ACC={mode:'auth',checked:true,err:e.message}}}
function authV(){const rs=ACC.mode==='reset',L={login:'Entrar',register:'Criar conta',forgot:'Enviar link'};return `<div class="sec" style="margin-top:0"><div><h2>Conta</h2><p class="mute" style="margin:2px 0 0">Login e cadastro reais com Supabase Auth.</p></div></div><div class="card" style="max-width:440px;margin:0 auto">${rs?`<h3>Nova senha</h3><form id="afr" style="margin-top:12px"><label class="f">Nova senha (mín. 10 caracteres)<input type="password" name="p" minlength="10" required></label><button class="btn">Salvar senha</button></form>`:`<div class="opt" style="margin-bottom:14px">${Object.keys(L).map(k=>`<button data-am="${k}" class="${AM===k?'on':''}">${k==='forgot'?'Esqueci a senha':L[k]}</button>`).join('')}</div><form id="afm">${AM==='register'?'<label class="f">Nome<input name="name" required></label>':''}<label class="f">E-mail<input name="email" type="email" required></label>${AM!=='forgot'?`<label class="f">Senha${AM==='register'?' (mín. 10 caracteres)':''}<input name="password" type="password" minlength="${AM==='register'?10:1}" required></label>`:''}${AM==='register'?'<label style="display:flex;gap:8px;margin-bottom:12px"><input type="checkbox" name="terms" style="width:auto;margin:3px 0 0" required> Aceito os termos de uso e a política de privacidade.</label>':''}<button class="btn">${L[AM]}</button></form>`}<div id="aam"></div>${ACC.err?`<div class="note">${esc(ACC.err)}</div>`:''}</div>`}
function bindAuth(){const app=$('#app'),m=t=>{const x=$('#aam');if(x)x.innerHTML=`<div class="note">${esc(t)}</div>`};
 app.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
  try{
   if(e.target.id==='afr'){await sbReq('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:d.p})});RECOVER=false;sbSave(SESS);await accDetect();render();return}
   if(AM==='login'){sbSave(mk(await sbReq('/auth/v1/token?grant_type=password',{method:'POST',anon:1,body:JSON.stringify({email:d.email,password:d.password})})));await accDetect();render()}
   else if(AM==='register'){const j=await sbReq('/auth/v1/signup',{method:'POST',anon:1,body:JSON.stringify({email:d.email,password:d.password,data:{name:d.name,terms_at:new Date().toISOString()}})});if(j.access_token){sbSave(mk(j));await accDetect();render()}else m('Conta criada. Confirme seu e-mail pelo link enviado pelo Supabase para poder entrar.')}
   else{await sbReq('/auth/v1/recover',{method:'POST',anon:1,body:JSON.stringify({email:d.email})});m('Se o e-mail existir, enviaremos o link de redefinição.')}
  }catch(x){m(x.message)}}}

 if(h==='modelo'){$('#fm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);if(!IMG.roupa||!IMG.modeloimg){$('#msg').innerHTML='<div class="note">Envie as duas imagens antes de registrar o pedido.</div>';return}
  addProject(d.get('n'),'Modelo virtual','Aguardando integração de IA');$('#msg').innerHTML='<div class="note">Pedido registrado no histórico. Nenhuma imagem foi gerada.</div>'}}

 if(h==='campanhas'){let txt='';$('#fc').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const pr=d.livre||d.prod||'nossa peça';const of=d.of?`\n${d.of}.`:'';
  txt=d.canal==='WhatsApp'?`Olá! Chegou a ${d.col}. ✨\nDestaque: ${pr}.${of}\nQuer ver os modelos e tamanhos? Responda aqui.`:d.canal==='Instagram'?`${d.col}: ${pr}.\nPeças pensadas para o seu dia a dia.${of}\nToque no link da bio e confira.\n#moda #${d.col.replace(/\W/g,'').toLowerCase()}`:`Lançamento ${d.col}\n${pr} abre a nova coleção.${of}\nDisponível a partir de hoje.`;
  $('#out').className='pv';$('#out').textContent=txt;addProject(d.col+' – '+d.canal,'Campanha','Rascunho')};
  $('#cp').onclick=()=>{try{navigator.clipboard.writeText(txt)}catch(e){}}}
 if(h==='vendas'&&S.products.length){const f=()=>{$('#ficha').innerHTML=fichaHTML(S.products.find(p=>p.id===$('#sp').value))};$('#sp').onchange=f;f()}
}

 $('#nav').innerHTML=NAV_H.map(([k,n])=>`<a href="#${k}" class="${k===act?'on':''}">${n}</a>`).join('');
 $('#app').innerHTML=V[v]();bindUploads(render);bind(v);bindP(v);bindC(v);bindV(v);bindA(v)}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});render();
